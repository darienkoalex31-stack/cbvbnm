<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata · Il Dono delle Note</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EF;--ink:#2E2340;--ink-2:#4A3F5C;--accent:#D2553F;--accent-d:#B8432F;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 'DM Sans',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 18px;text-align:center}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(30px,7vw,44px);line-height:1.1;margin:12px 0}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
p{color:var(--ink-2);margin:0 0 26px}
a{display:inline-block;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;padding:16px 28px;border-radius:999px}
a:hover{background:var(--accent-d)}
.n{font-size:54px}
</style>
</head>
<body>
<main>
  <div class="n" aria-hidden="true">🎵</div>
  <h1>Questa pagina <em>non suona</em></h1>
  <p>Non l'abbiamo trovata. Torna alla pagina principale e crea la canzone di tuo figlio.</p>
  <a href="/">Crea la sua canzone →</a>
</main>
</body>
</html>
